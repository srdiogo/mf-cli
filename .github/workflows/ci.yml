name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.1", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --release --locked
      - run: sha256sum -c docs/mf4/SHA256SUMS
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y linux-headers-generic
      - name: Build only; never load the module
        run: |
          for kdir in /usr/src/linux-headers-*-generic; do
            make -C kmod KDIR="$kdir" W=1
          done

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm base-devel git rust pkgconf libusb dkms
      - uses: actions/checkout@v4
      - name: Build transport package without loading a module
        run: |
          useradd --create-home builder
          install -d -o builder -g builder /tmp/package
          cp packaging/arch/PKGBUILD /tmp/package/PKGBUILD
          chown builder:builder /tmp/package/PKGBUILD
          runuser -u builder -- sh -c 'cd /tmp/package && makepkg --cleanbuild --noconfirm'
      - uses: actions/upload-artifact@v4
        with:
          name: mf-cli-platform-arch-preview
          path: /tmp/package/*.pkg.tar.zst
